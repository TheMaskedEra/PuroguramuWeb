include:
  - project: 'lessons/info/ue19/ci'
    ref: main
    file:
      - 'dotnet.yml'
variables:
  NET_VERSION: "6.0"
  BUILD_DOCKER: "true"
  
before_script:
  - apk update
  - apk add --no-cache nodejs npm
  - 'which npm || (curl -sL https://deb.nodesource.com/setup_21.x | sh)'
  - 'which npm || apk add --no-cache nodejs'
  - cd Puroguramu.App
  - npm install

build:
  script:
    - dotnet build -c $CONFIGURATION

