include:
  - project: 'lessons/info/ue19/ci'
    ref: main
    file:
      - 'dotnet.yml'
variables:
  NET_VERSION: "6.0"
  BUILD_DOCKER: "true"
  
before_script:
  - 'which npm || (curl -sL https://deb.nodesource.com/setup_21.x | bash -)'
  - 'which npm || apt-get install -y nodejs'
  - npm install

build:
  script:
    - dotnet build -c $CONFIGURATION

