include:
  - project: 'lessons/info/ue19/ci'
    ref: main
    file:
      - 'dotnet.yml'
variables:
  NET_VERSION: "6.0"
  BUILD_DOCKER: "true"
  
before_script:
  - apk update && apk add --no-cache curl nodejs npm
  - cd Puroguramu.App
  - npm install

build:
  script:
    - dotnet build -c $CONFIGURATION

