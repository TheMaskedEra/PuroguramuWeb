include:
  - project: 'lessons/info/ue19/ci'
    ref: main
    file:
      - 'dotnet.yml'
variables:
  NET_VERSION: "6.0"
  BUILD_DOCKER: "true"
  
before_script:
  - apt-get update
  - apt-get install -y curl
  - curl -sL https://deb.nodesource.com/setup_16.x | bash -
  - apt-get install -y nodejs
  - cd Puroguramu.App
  - npm install

build:
  script:
    - dotnet build -c $CONFIGURATION

